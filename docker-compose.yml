name: watchtower

services:
  watchtower:
    build:
      context: .
      dockerfile: Dockerfile
    image: watchtower:local
    container_name: watchtower
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/os_tracker.db}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,37.120.198.236}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    ports:
      - "${HOST_BIND:-0.0.0.0}:${PORT:-8000}:8000"
    volumes:
      - watchtower-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; host=os.environ.get('ALLOWED_HOSTS','127.0.0.1').split(',')[0].strip(); paths=('/health','/static/css/app.css','/static/js/app.js','/static/watchtower.svg'); [urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000'+path,headers={'Host':host}),timeout=3).read() for path in paths]"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  watchtower-data:
