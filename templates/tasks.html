{% extends "base.html" %}
{% block title %}Task Management · WatchTower{% endblock %}
{% block content %}
<section class="page-heading"><div><span class="eyebrow">COLLABORATION</span><h1>Task Management</h1><p class="muted">Create, assign, and track work with your team.</p></div><button class="button button-primary" id="task-create">＋ Create Task</button></section>
<section class="task-toolbar"><div class="task-tabs" role="tablist"><button class="task-tab active" data-view="my">My Tasks</button><button class="task-tab" data-view="all">All Tasks</button><button class="task-tab" data-view="assigned_by_me">Assigned by Me</button><button class="task-tab" data-view="overdue">Overdue</button><button class="task-tab" data-view="completed">Completed</button></div><div class="task-controls"><input id="task-search" type="search" placeholder="Search tasks…" aria-label="Search tasks"><select id="task-assignee-filter"><option value="">All assignees</option></select><select id="task-creator-filter"><option value="">All creators</option></select><select id="task-status-filter"><option value="">All statuses</option><option value="todo">To Do</option><option value="in_progress">In Progress</option><option value="on_hold">On Hold</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select><select id="task-priority-filter"><option value="">All priorities</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select><select id="task-due-filter"><option value="">Any deadline</option><option value="upcoming">Upcoming</option><option value="overdue">Overdue</option></select><select id="task-sort"><option value="created_at:desc">Newest</option><option value="created_at:asc">Oldest</option><option value="due_at:asc">Due date</option><option value="priority:desc">Priority</option><option value="title:asc">Title</option></select><button id="task-layout" class="button button-secondary" type="button">Board View</button></div></section>
<section class="task-stats" id="task-stats" aria-label="Task summary"></section>
<div class="task-message" id="task-message" role="status"></div><section id="task-list" class="task-list" aria-live="polite"><div class="loading-state">Loading tasks…</div></section><div id="task-pagination" class="pagination"></div>
<dialog id="task-dialog" class="task-dialog"><form id="task-form" method="dialog"><div class="dialog-heading"><div><span class="eyebrow">TASK DETAILS</span><h2 id="task-dialog-title">Create task</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></div><input id="task-id" type="hidden"><label>Title<input id="task-title" maxlength="200" required></label><label>Description<textarea id="task-description" rows="4" maxlength="20000"></textarea></label><label>Assigned to<select id="task-assignees" multiple size="4"></select><small>Use Ctrl/Command to select multiple people.</small></label><div class="form-row"><label>Priority<select id="task-priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option><option value="urgent">Urgent</option></select></label><label>Status<select id="task-state"><option value="todo">To Do</option><option value="in_progress">In Progress</option><option value="on_hold">On Hold</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></label></div><label>Due date<input id="task-due" type="datetime-local"></label><div class="task-dialog-actions"><button type="button" id="task-delete" class="button button-danger" hidden>Delete</button><span></span><button type="button" class="button button-secondary" id="task-cancel">Cancel</button><button type="submit" class="button button-primary">Save task</button></div><div id="task-detail-extra"></div></form></dialog>
{% endblock %}
